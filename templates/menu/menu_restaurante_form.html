{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block page %}
<main class="page-shell">
    <div class="form-container">
        <div class="section-heading">
            <h1>{{ titulo }}</h1>
            <p>Asigna un nombre para identificar esta carta.</p>
        </div>

        <form method="post" class="app-form">
            {% csrf_token %}
            {% for field in form %}
                {% include "components/form_field.html" with field=field %}
            {% endfor %}
            <button type="submit" class="btn btn-primary">Guardar menu</button>
            <a href="{% url 'crear_menu' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</main>
{% endblock %}
